apiVersion: apps/v1
kind: Deployment

metadata:
  name: nginx-deployment
  labels:
    app: nginx-static-website

spec:
  replicas: 2

  selector:
    matchLabels:
      app: nginx-static-website

  template:
    metadata:
      labels:
        app: nginx-static-website

    spec:
      containers:
      - name: nginx-static-website
        image: vinitparmar03/nginx_static_website
        ports:
        - containerPort: 80


---

apiVersion: v1
kind: Service
metadata:
  name: nginx-static-website
spec:
  type: LoadBalancer
  selector:
    app: nginx-static-website
  ports:
  - protocol: TCP
    port: 80
    targetPort: 80